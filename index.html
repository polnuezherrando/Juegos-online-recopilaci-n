<?php
// Configuración de rutas simplificada para evitar fallos de permisos
$logFile = __DIR__ . '/visitas.log';

// Obtener la IP real de la visita de forma segura
$ip = $_SERVER['REMOTE_ADDR'] ?? 'desconocida';
$ip = filter_var($ip, FILTER_VALIDATE_IP) ? $ip : 'desconocida';

// Obtener la fecha y hora actual en formato UTC
$timestamp = gmdate('Y-m-d H:i:s') . ' UTC';

// Preparar la línea de texto a guardar
$logLine = $timestamp . ' | ' . $ip . PHP_EOL;

// Escribir en el archivo (se creará automáticamente si no existe)
file_put_contents($logFile, $logLine, FILE_APPEND | LOCK_EX);
?>
